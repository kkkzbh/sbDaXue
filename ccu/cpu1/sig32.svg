<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aluGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2d3748"></text>
  
  <!-- Main Data Path Line -->
  <line x1="50" y1="300" x2="1350" y2="300" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- PC Module -->
  <rect x="50" y="270" width="80" height="60" rx="8" fill="url(#pcGrad)" filter="url(#shadow)"/>
  <text x="90" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">PC</text>
  <text x="90" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">程序计数器</text>
  <text x="90" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">32位地址</text>
  
  <!-- Instruction Memory -->
  <rect x="180" y="270" width="120" height="60" rx="8" fill="url(#memGrad)" filter="url(#shadow)"/>
  <text x="240" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">指令存储器</text>
  <text x="240" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Instruction</text>
  <text x="240" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Memory</text>
  
  <!-- Control Unit -->
  <rect x="350" y="100" width="120" height="60" rx="8" fill="url(#ctrlGrad)" filter="url(#shadow)"/>
  <text x="410" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3748">控制单元</text>
  <text x="410" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2d3748">Control Unit</text>
  <text x="410" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">生成控制信号</text>
  
  <!-- Register File -->
  <rect x="350" y="270" width="120" height="60" rx="8" fill="url(#regGrad)" filter="url(#shadow)"/>
  <text x="410" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">寄存器文件</text>
  <text x="410" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Register File</text>
  <text x="410" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">读取rs,rt数据</text>
  
  <!-- ALU Input MUX -->
  <polygon points="520,285 520,315 560,300" fill="#cbd5e0" stroke="#a0aec0" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">MUX</text>
  
  <!-- ALU -->
  <rect x="610" y="270" width="100" height="60" rx="8" fill="url(#aluGrad)" filter="url(#shadow)"/>
  <text x="660" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3748">ALU</text>
  <text x="660" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2d3748">运算单元</text>
  <text x="660" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">执行运算</text>
  
  <!-- ALU Output MUX -->
  <polygon points="760,285 760,315 800,300" fill="#cbd5e0" stroke="#a0aec0" stroke-width="2" filter="url(#shadow)"/>
  <text x="775" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">MUX</text>
  
  <!-- Data Memory -->
  <rect x="850" y="270" width="120" height="60" rx="8" fill="url(#memGrad)" filter="url(#shadow)"/>
  <text x="910" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">数据存储器</text>
  <text x="910" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Data Memory</text>
  <text x="910" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">加载/存储</text>
  
  <!-- Write Back MUX -->
  <polygon points="1020,285 1020,315 1060,300" fill="#cbd5e0" stroke="#a0aec0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">MUX</text>
  
  <!-- Main Data Path Connections -->
  <!-- PC to Instruction Memory -->
  <line x1="130" y1="300" x2="180" y2="300" stroke="#4299e1" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="155" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4299e1">地址</text>
  
  <!-- Instruction Memory to Register File -->
  <line x1="300" y1="300" x2="350" y2="300" stroke="#e53e3e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="325" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e53e3e">指令</text>
  
  <!-- Register File to ALU MUX -->
  <line x1="470" y1="300" x2="520" y2="300" stroke="#9f7aea" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="495" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9f7aea">操作数</text>
  
  <!-- ALU MUX to ALU -->
  <line x1="560" y1="300" x2="610" y2="300" stroke="#9f7aea" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- ALU to ALU Output MUX -->
  <line x1="710" y1="300" x2="760" y2="300" stroke="#48bb78" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="735" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#48bb78">结果</text>
  
  <!-- ALU Output MUX to Data Memory -->
  <line x1="800" y1="300" x2="850" y2="300" stroke="#48bb78" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Data Memory to Write Back MUX -->
  <line x1="970" y1="300" x2="1020" y2="300" stroke="#f56565" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="995" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f56565">读数据</text>
  
  <!-- Write Back Path -->
  <line x1="1060" y1="300" x2="1100" y2="300" stroke="#805ad5" stroke-width="3"/>
  <line x1="1100" y1="300" x2="1100" y2="400" stroke="#805ad5" stroke-width="3"/>
  <line x1="1100" y1="400" x2="410" y2="400" stroke="#805ad5" stroke-width="3"/>
  <line x1="410" y1="400" x2="410" y2="330" stroke="#805ad5" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="750" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#805ad5">写回数据</text>
  
  <!-- Control Signals -->
  <!-- Opcode to Control Unit -->
  <line x1="300" y1="270" x2="350" y2="160" stroke="#ed8936" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ed8936">操作码</text>
  
  <!-- Control signals to components -->
  <line x1="410" y1="160" x2="540" y2="285" stroke="#718096" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="430" y1="160" x2="660" y2="270" stroke="#718096" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="450" y1="160" x2="780" y2="285" stroke="#718096" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="470" y1="160" x2="910" y2="270" stroke="#718096" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="410" y1="160" x2="1040" y2="285" stroke="#718096" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- ALU Status Signals -->
  <line x1="660" y1="270" x2="660" y2="200" stroke="#f6ad55" stroke-width="2"/>
  <line x1="660" y1="200" x2="410" y2="200" stroke="#f6ad55" stroke-width="2"/>
  <line x1="410" y1="200" x2="410" y2="160" stroke="#f6ad55" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="535" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f6ad55">零标志</text>
  
  <!-- Second operand paths -->
  <line x1="470" y1="330" x2="470" y2="360" stroke="#9f7aea" stroke-width="2"/>
  <line x1="470" y1="360" x2="540" y2="360" stroke="#9f7aea" stroke-width="2"/>
  <line x1="540" y1="360" x2="540" y2="315" stroke="#9f7aea" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="505" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9f7aea">rt数据</text>
  
  <!-- Immediate value path -->
  <line x1="300" y1="330" x2="300" y2="380" stroke="#38b2ac" stroke-width="2"/>
  <line x1="300" y1="380" x2="540" y2="380" stroke="#38b2ac" stroke-width="2"/>
  <line x1="540" y1="380" x2="540" y2="315" stroke="#38b2ac" stroke-width="2"/>
  <text x="420" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#38b2ac">立即数</text>
  
  <!-- ALU result bypass -->
  <line x1="710" y1="330" x2="710" y2="350" stroke="#48bb78" stroke-width="2"/>
  <line x1="710" y1="350" x2="780" y2="350" stroke="#48bb78" stroke-width="2"/>
  <line x1="780" y1="350" x2="780" y2="315" stroke="#48bb78" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Component Labels -->
  <text x="90" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3748">1</text>
  <text x="240" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3748">2</text>
  <text x="410" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3748">3</text>
  <text x="410" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3748">4</text>
  <text x="660" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3748">5</text>
  <text x="910" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2d3748">6</text>
  
  <!-- Legend -->
  <rect x="50" y="450" width="300" height="120" rx="5" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="470" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3748">图例说明</text>
  
  <line x1="60" y1="485" x2="90" y2="485" stroke="#4299e1" stroke-width="3"/>
  <text x="95" y="490" font-family="Arial, sans-serif" font-size="10" fill="#2d3748">32位数据总线</text>
  
  <line x1="60" y1="500" x2="90" y2="500" stroke="#718096" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="95" y="505" font-family="Arial, sans-serif" font-size="10" fill="#2d3748">控制信号</text>
  
  <line x1="60" y1="515" x2="90" y2="515" stroke="#f6ad55" stroke-width="2"/>
  <text x="95" y="520" font-family="Arial, sans-serif" font-size="10" fill="#2d3748">状态信号</text>
  
  <line x1="60" y1="530" x2="90" y2="530" stroke="#805ad5" stroke-width="3"/>
  <text x="95" y="535" font-family="Arial, sans-serif" font-size="10" fill="#2d3748">写回路径</text>
  
  <text x="60" y="555" font-family="Arial, sans-serif" font-size="10" fill="#2d3748">执行顺序: 1→2→3→4→5→6</text>
</svg>