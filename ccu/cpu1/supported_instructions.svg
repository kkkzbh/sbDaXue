<svg width="1350" height="840" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .header-text { font-family: sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
            .type-text { font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
            .body-text { font-family: sans-serif; font-size: 14px; text-anchor: middle; }
            .code-text { font-family: "Courier New", Courier, monospace; font-size: 13px; text-anchor: middle; }
        </style>
    </defs>

    <!-- Header Cells -->
    <rect x="0" y="0" width="100" height="40" fill="#e0e8f0" stroke="#ccc" stroke-width="1"/>
    <text x="50" y="25" class="header-text">指令类型</text>
    <rect x="100" y="0" width="200" height="40" fill="#e0e8f0" stroke="#ccc" stroke-width="1"/>
    <text x="200" y="25" class="header-text">汇编指令</text>
    <rect x="300" y="0" width="180" height="40" fill="#e0e8f0" stroke="#ccc" stroke-width="1"/>
    <text x="390" y="25" class="header-text">指令码 (op/funct)</text>
    <rect x="480" y="0" width="150" height="40" fill="#e0e8f0" stroke="#ccc" stroke-width="1"/>
    <text x="555" y="25" class="header-text">源操作数 1</text>
    <rect x="630" y="0" width="150" height="40" fill="#e0e8f0" stroke="#ccc" stroke-width="1"/>
    <text x="705" y="25" class="header-text">源操作数 2</text>
    <rect x="780" y="0" width="150" height="40" fill="#e0e8f0" stroke="#ccc" stroke-width="1"/>
    <text x="855" y="25" class="header-text">目的寄存器</text>
    <rect x="930" y="0" width="420" height="40" fill="#e0e8f0" stroke="#ccc" stroke-width="1"/>
    <text x="1140" y="25" class="header-text">功能描述</text>

    <!-- R-Type Merged Cell -->
    <rect x="0" y="40" width="100" height="450" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="50" y="265" class="type-text">R-Type</text>

    <!-- R-Type Rows -->
    <rect x="100" y="40" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="65" class="code-text">addu rd, rs, rt</text>
    <rect x="300" y="40" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="65" class="code-text">000000 / 100001</text>
    <rect x="480" y="40" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="65" class="body-text">GPR[rs]</text>
    <rect x="630" y="40" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="65" class="body-text">GPR[rt]</text>
    <rect x="780" y="40" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="65" class="body-text">rd</text>
    <rect x="930" y="40" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="65" class="code-text">GPR[rd] ← GPR[rs] + GPR[rt]</text>
    
    <rect x="100" y="90" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="115" class="code-text">subu rd, rs, rt</text>
    <rect x="300" y="90" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="115" class="code-text">000000 / 100011</text>
    <rect x="480" y="90" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="115" class="body-text">GPR[rs]</text>
    <rect x="630" y="90" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="115" class="body-text">GPR[rt]</text>
    <rect x="780" y="90" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="115" class="body-text">rd</text>
    <rect x="930" y="90" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="115" class="code-text">GPR[rd] ← GPR[rs] - GPR[rt]</text>

    <rect x="100" y="140" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="165" class="code-text">slt rd, rs, rt</text>
    <rect x="300" y="140" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="165" class="code-text">000000 / 101010</text>
    <rect x="480" y="140" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="165" class="body-text">GPR[rs]</text>
    <rect x="630" y="140" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="165" class="body-text">GPR[rt]</text>
    <rect x="780" y="140" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="165" class="body-text">rd</text>
    <rect x="930" y="140" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="165" class="code-text">GPR[rd] ← (GPR[rs] &lt; GPR[rt]) ? 1 : 0</text>

    <rect x="100" y="190" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="215" class="code-text">and rd, rs, rt</text>
    <rect x="300" y="190" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="215" class="code-text">000000 / 100100</text>
    <rect x="480" y="190" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="215" class="body-text">GPR[rs]</text>
    <rect x="630" y="190" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="215" class="body-text">GPR[rt]</text>
    <rect x="780" y="190" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="215" class="body-text">rd</text>
    <rect x="930" y="190" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="215" class="code-text">GPR[rd] ← GPR[rs] &amp; GPR[rt]</text>

    <rect x="100" y="240" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="265" class="code-text">nor rd, rs, rt</text>
    <rect x="300" y="240" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="265" class="code-text">000000 / 100111</text>
    <rect x="480" y="240" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="265" class="body-text">GPR[rs]</text>
    <rect x="630" y="240" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="265" class="body-text">GPR[rt]</text>
    <rect x="780" y="240" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="265" class="body-text">rd</text>
    <rect x="930" y="240" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="265" class="code-text">GPR[rd] ← ~(GPR[rs] | GPR[rt])</text>

    <rect x="100" y="290" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="315" class="code-text">or rd, rs, rt</text>
    <rect x="300" y="290" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="315" class="code-text">000000 / 100101</text>
    <rect x="480" y="290" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="315" class="body-text">GPR[rs]</text>
    <rect x="630" y="290" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="315" class="body-text">GPR[rt]</text>
    <rect x="780" y="290" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="315" class="body-text">rd</text>
    <rect x="930" y="290" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="315" class="code-text">GPR[rd] ← GPR[rs] | GPR[rt]</text>

    <rect x="100" y="340" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="365" class="code-text">xor rd, rs, rt</text>
    <rect x="300" y="340" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="365" class="code-text">000000 / 100110</text>
    <rect x="480" y="340" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="365" class="body-text">GPR[rs]</text>
    <rect x="630" y="340" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="365" class="body-text">GPR[rt]</text>
    <rect x="780" y="340" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="365" class="body-text">rd</text>
    <rect x="930" y="340" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="365" class="code-text">GPR[rd] ← GPR[rs] ^ GPR[rt]</text>

    <rect x="100" y="390" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="415" class="code-text">sll rd, rt, shamt</text>
    <rect x="300" y="390" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="415" class="code-text">000000 / 000000</text>
    <rect x="480" y="390" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="415" class="body-text">GPR[rt]</text>
    <rect x="630" y="390" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="415" class="body-text">shamt</text>
    <rect x="780" y="390" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="415" class="body-text">rd</text>
    <rect x="930" y="390" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="415" class="code-text">GPR[rd] ← GPR[rt] &lt;&lt; shamt</text>

    <rect x="100" y="440" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="465" class="code-text">srl rd, rt, shamt</text>
    <rect x="300" y="440" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="465" class="code-text">000000 / 000010</text>
    <rect x="480" y="440" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="465" class="body-text">GPR[rt]</text>
    <rect x="630" y="440" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="465" class="body-text">shamt</text>
    <rect x="780" y="440" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="465" class="body-text">rd</text>
    <rect x="930" y="440" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="465" class="code-text">GPR[rd] ← GPR[rt] &gt;&gt; shamt</text>

    <!-- I-Type Merged Cell -->
    <rect x="0" y="490" width="100" height="300" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="50" y="640" class="type-text">I-Type</text>

    <!-- I-Type Rows -->
    <rect x="100" y="490" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="515" class="code-text">addiu rt, rs, imm</text>
    <rect x="300" y="490" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="515" class="code-text">001001</text>
    <rect x="480" y="490" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="515" class="body-text">GPR[rs]</text>
    <rect x="630" y="490" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="515" class="body-text">sign_ext(imm)</text>
    <rect x="780" y="490" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="515" class="body-text">rt</text>
    <rect x="930" y="490" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="515" class="code-text">GPR[rt] ← GPR[rs] + sign_ext(imm)</text>

    <rect x="100" y="540" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="565" class="code-text">slti rt, rs, imm</text>
    <rect x="300" y="540" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="565" class="code-text">001010</text>
    <rect x="480" y="540" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="565" class="body-text">GPR[rs]</text>
    <rect x="630" y="540" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="565" class="body-text">sign_ext(imm)</text>
    <rect x="780" y="540" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="565" class="body-text">rt</text>
    <rect x="930" y="540" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="565" class="code-text">GPR[rt] ← (GPR[rs] &lt; sign_ext(imm)) ? 1 : 0</text>

    <rect x="100" y="590" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="615" class="code-text">lw rt, imm(rs)</text>
    <rect x="300" y="590" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="615" class="code-text">100011</text>
    <rect x="480" y="590" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="615" class="body-text">GPR[rs]</text>
    <rect x="630" y="590" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="615" class="body-text">sign_ext(imm)</text>
    <rect x="780" y="590" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="615" class="body-text">rt</text>
    <rect x="930" y="590" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="615" class="code-text">GPR[rt] ← MEM[GPR[rs] + sign_ext(imm)]</text>

    <rect x="100" y="640" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="665" class="code-text">sw rt, imm(rs)</text>
    <rect x="300" y="640" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="665" class="code-text">101011</text>
    <rect x="480" y="640" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="665" class="body-text">GPR[rs]</text>
    <rect x="630" y="640" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="665" class="body-text">GPR[rt]</text>
    <rect x="780" y="640" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="665" class="body-text">-</text>
    <rect x="930" y="640" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="665" class="code-text">MEM[GPR[rs] + sign_ext(imm)] ← GPR[rt]</text>

    <rect x="100" y="690" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="715" class="code-text">beq rs, rt, imm</text>
    <rect x="300" y="690" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="715" class="code-text">000100</text>
    <rect x="480" y="690" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="715" class="body-text">GPR[rs]</text>
    <rect x="630" y="690" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="715" class="body-text">GPR[rt]</text>
    <rect x="780" y="690" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="715" class="body-text">PC</text>
    <rect x="930" y="690" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="715" class="code-text">if (GPR[rs] == GPR[rt]) PC ← PC+4+(imm&lt;&lt;2)</text>

    <rect x="100" y="740" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="765" class="code-text">bne rs, rt, imm</text>
    <rect x="300" y="740" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="765" class="code-text">000101</text>
    <rect x="480" y="740" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="765" class="body-text">GPR[rs]</text>
    <rect x="630" y="740" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="765" class="body-text">GPR[rt]</text>
    <rect x="780" y="740" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="765" class="body-text">PC</text>
    <rect x="930" y="740" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="765" class="code-text">if (GPR[rs] != GPR[rt]) PC ← PC+4+(imm&lt;&lt;2)</text>

    <!-- J-Type Merged Cell -->
    <rect x="0" y="790" width="100" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
    <text x="50" y="815" class="type-text">J-Type</text>

    <!-- J-Type Row -->
    <rect x="100" y="790" width="200" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="200" y="815" class="code-text">j target</text>
    <rect x="300" y="790" width="180" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="390" y="815" class="code-text">000010</text>
    <rect x="480" y="790" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="555" y="815" class="body-text">PC</text>
    <rect x="630" y="790" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="705" y="815" class="body-text">target</text>
    <rect x="780" y="790" width="150" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="855" y="815" class="body-text">PC</text>
    <rect x="930" y="790" width="420" height="50" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="1140" y="815" class="code-text">PC ← {PC[31:28], target, 2'b00}</text>
</svg> 