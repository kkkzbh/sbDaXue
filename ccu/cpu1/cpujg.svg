<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000040"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1000" height="700" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- 标题 -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50"></text>
  
  <!-- PC (程序计数器) -->
  <rect x="50" y="100" width="100" height="60" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">PC</text>
  <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">程序计数器</text>
  
  <!-- 指令存储器 -->
  <rect x="200" y="80" width="120" height="100" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">指令存储器</text>
  <text x="260" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Instruction</text>
  <text x="260" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Memory</text>
  <text x="260" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">32位指令</text>
  
  <!-- 控制单元 -->
  <rect x="380" y="60" width="120" height="80" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">控制单元</text>
  <text x="440" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Control Unit</text>
  <text x="440" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">产生控制信号</text>
  
  <!-- 寄存器文件 -->
  <rect x="100" y="250" width="140" height="120" rx="8" fill="#2ecc71" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">寄存器文件</text>
  <text x="170" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Register File</text>
  <text x="170" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">32个通用寄存器</text>
  <text x="170" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">读端口1</text>
  <text x="170" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">读端口2</text>
  <text x="170" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">写端口</text>
  
  <!-- ALU -->
  <rect x="350" y="280" width="120" height="100" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ALU</text>
  <text x="410" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">算术逻辑单元</text>
  <text x="410" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">加减乘除</text>
  <text x="410" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">逻辑运算</text>
  
  <!-- 数据存储器 -->
  <rect x="550" y="250" width="120" height="120" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">数据存储器</text>
  <text x="610" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Data Memory</text>
  <text x="610" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Load/Store</text>
  <text x="610" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">数据读写</text>
  
  <!-- 立即数扩展单元 -->
  <rect x="100" y="420" width="100" height="60" rx="8" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">立即数</text>
  <text x="150" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">扩展</text>
  <text x="150" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Sign Extend</text>
  
  <!-- 多路选择器 -->
  <polygon points="280,420 320,405 320,435" fill="#34495e" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">MUX</text>
  
  <polygon points="500,280 540,265 540,295" fill="#34495e" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">MUX</text>
  
  <polygon points="720,300 760,285 760,315" fill="#34495e" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">MUX</text>
  
  <!-- PC+4 加法器 -->
  <circle cx="100" cy="50" r="20" fill="#1abc9c" stroke="#16a085" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">+4</text>
  
  <!-- 连接线 -->
  <!-- PC到指令存储器 -->
  <line x1="150" y1="130" x2="200" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="175" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">地址</text>
  
  <!-- 指令存储器到控制单元 -->
  <line x1="320" y1="100" x2="380" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="350" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">指令</text>
  
  <!-- 指令到寄存器文件 -->
  <line x1="260" y1="180" x2="260" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="260" y1="220" x2="170" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="170" y1="220" x2="170" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">寄存器地址</text>
  
  <!-- 寄存器文件到ALU -->
  <line x1="240" y1="310" x2="350" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="295" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">数据1</text>
  
  <line x1="240" y1="340" x2="280" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="340" x2="280" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="260" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">数据2</text>
  
  <!-- 立即数到MUX -->
  <line x1="200" y1="450" x2="280" y2="425" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- MUX到ALU -->
  <line x1="320" y1="420" x2="380" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="420" x2="380" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ALU到数据存储器 -->
  <line x1="470" y1="330" x2="500" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="330" x2="500" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="280" x2="550" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="510" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">地址</text>
  
  <!-- 数据存储器到MUX -->
  <line x1="670" y1="310" x2="720" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ALU结果到MUX -->
  <line x1="470" y1="310" x2="520" y2="310" stroke="#333" stroke-width="2"/>
  <line x1="520" y1="310" x2="520" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="520" y1="350" x2="680" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="680" y1="350" x2="680" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="680" y1="330" x2="720" y2="315" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 写回寄存器 -->
  <line x1="760" y1="300" x2="800" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="800" y1="300" x2="800" y2="500" stroke="#333" stroke-width="2"/>
  <line x1="800" y1="500" x2="50" y2="500" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="500" x2="50" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="370" x2="100" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">写回数据</text>
  
  <!-- PC+4 -->
  <line x1="100" y1="70" x2="100" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="10" fill="#333">PC+4</text>
  
  <!-- 控制信号 -->
  <line x1="440" y1="140" x2="440" y2="200" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="200" x2="580" y2="200" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="440" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">控制信号</text>
  
  <!-- 数据路径说明 -->
  <text x="50" y="650" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">数据路径:</text>
  <line x1="120" y1="645" x2="150" y2="645" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="160" y="650" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">实线 - 数据流</text>
  
  <text x="300" y="650" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">控制信号:</text>
  <line x1="370" y1="645" x2="400" y2="645" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="410" y="650" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">虚线</text>
  
</svg>